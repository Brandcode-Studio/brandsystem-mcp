<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quarry Supply Co.</title>
  <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
  <link rel="apple-touch-icon" href="/assets/touch-icon.png">
  <meta property="og:image" content="https://quarry.example/assets/og-card.png">
  <style>
    :root { --brand-primary: #b45309; --color-neutral: #57534e; }
    body { font-family: "Archivo", sans-serif; background-color: #fafaf9; color: #292524; }
    h1 { font-family: "Archivo", sans-serif; }
    a { color: #b45309; }
    .btn { background-color: #b45309; color: #fafaf9; }
  </style>
</head>
<body>
  <header class="site-header">
    <button class="menu" aria-label="Open menu">
      <svg class="icon" width="20" height="20" viewBox="0 0 20 20"><path d="M2 5h16M2 10h16M2 15h16" stroke="#292524"/></svg>
    </button>
    <a href="/" class="site-logo">
      <svg class="logo" width="132" height="36" viewBox="0 0 132 36" xmlns="http://www.w3.org/2000/svg" aria-label="Quarry Supply logo">
        <polygon points="6,30 18,6 30,30" fill="#b45309"/>
        <text x="38" y="25" font-family="Archivo" font-size="16" fill="#292524">Quarry Supply</text>
      </svg>
    </a>
    <img src="/assets/logo-full.png" alt="Quarry Supply logo lockup" width="160" height="40">
  </header>
  <main>
    <h1>Tools that outlast the job</h1>
    <a class="btn" href="/catalog">Browse catalog</a>
  </main>
  <footer>
    <a href="https://twitter.com/quarry"><svg class="icon social" width="16" height="16" viewBox="0 0 16 16"><path d="M1 14 C4 10 8 4 15 2" stroke="#57534e"/></svg></a>
  </footer>

</html>
