<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Analytics — Clarity for your data</title>
  <style>
    :root {
      --brand-primary: #0f62fe;
      --color-secondary: #6f2dbd;
      --accent-color: #ff7f11;
      --surface-muted: #f4f4f4;
      --text-main: #161616;
    }
    body {
      font-family: "Source Sans Pro", sans-serif;
      color: var(--text-main);
      background-color: #ffffff;
      margin: 0;
    }
    p { font-family: "Source Sans Pro", sans-serif; }
    h1 { font-family: "Fraunces", serif; }
    h2 { font-family: "Fraunces", serif; }
    a { color: var(--brand-primary); }
    .btn {
      background-color: #0f62fe;
      color: #ffffff;
      border-color: #0f62fe;
    }
    .btn-secondary { background-color: #6f2dbd; }
    .badge { background-color: #ff7f11; }
    footer { background-color: #f4f4f4; color: #161616; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" aria-label="Northwind home">
      <svg class="logo" width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg" aria-label="Northwind logo">
        <rect x="2" y="6" width="28" height="28" rx="6" fill="#0f62fe"/>
        <path d="M10 28 L16 12 L22 28 Z" fill="#ffffff"/>
        <text x="38" y="27" font-family="Fraunces" font-size="18" fill="#161616">Northwind</text>
      </svg>
    </a>
    <nav><a href="/product">Product</a><a href="/pricing">Pricing</a></nav>
  </header>
  <main>
    <h1>Clarity for your data</h1>
    <p>Northwind turns raw telemetry into decisions.</p>
    <a class="btn" href="/signup">Start free</a>
    <a class="btn-secondary" href="/demo">Book a demo</a>
    <span class="badge">New</span>
  </main>
  <footer>© Northwind Analytics</footer>
</body>
</html>
