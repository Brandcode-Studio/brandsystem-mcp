name: Publish to npm

# Only the npm-publish and registry-publish jobs can mint an OIDC publish token,
# and neither installs dependencies or runs repo code: the tarball is built,
# tested and hashed in `build` (no id-token), then published as an artifact.
# A compromised dev dependency or test therefore never sees publish credentials.

on:
  workflow_dispatch:
    inputs:
      registry_only:
        description: Publish existing package metadata to the MCP Registry only
        required: false
        type: boolean
        default: false
  release:
    types: [created]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'release' || !inputs.registry_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Release gate — ref, version, and main ancestry
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package.json ($expected)"
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual full publishes run only from main (got $GITHUB_REF)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release commit $(git rev-parse --short HEAD) is not on main — merge the release PR before tagging"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Production dependency audit (allowlist-aware)
        run: node scripts/audit-gate.mjs --omit=dev
      - name: Pack and hash
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0))[0].filename)')
          sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball sha256=$sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: SBOM (CycloneDX, production dependencies) and checksums
        # Release evidence is produced here, in the credential-free job, and
        # only attached to the GitHub release later by `release-assets`.
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          node scripts/generate-sbom.mjs --out release-evidence/brandsystem-mcp.cdx.json
          jq -n \
            --arg package "$(node -p "require('./package.json').name")" \
            --arg version "$(node -p "require('./package.json').version")" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{package: $package, version: $version, commit: $commit, ref: $ref, node: $node, npm: $npm, workflow_run: $run}' \
            > release-evidence/build-info.json
          cp "$TARBALL" release-evidence/
          (cd release-evidence && sha256sum "$TARBALL" brandsystem-mcp.cdx.json build-info.json > SHA256SUMS && rm "$TARBALL")
          {
            echo '### Release evidence'
            echo '```'
            cat release-evidence/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90
          if-no-files-found: error

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
      - name: Verify tarball hash from build job
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish tarball with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./${TARBALL}" --provenance --access public

  # Attach the SBOM, build info, and SHA256SUMS (tarball + SBOM) to the GitHub
  # release. contents: write only — no id-token, no checkout, no repo code:
  # it downloads the build job's artifacts, re-checks the hashes, and uploads.
  release-assets:
    needs: [build, npm-publish]
    if: ${{ github.event_name == 'release' && needs.npm-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: tarball
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: release-evidence
      - name: Verify evidence against the build job's tarball hash
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  tarball/${TARBALL}" | sha256sum --check
          grep -qxF "${EXPECTED_SHA256}  ${TARBALL}" release-evidence/SHA256SUMS
          cp "tarball/${TARBALL}" release-evidence/
          (cd release-evidence && sha256sum --check SHA256SUMS && rm "${TARBALL}")
      - name: Upload SBOM and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            release-evidence/brandsystem-mcp.cdx.json \
            release-evidence/build-info.json \
            release-evidence/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Claude Desktop one-click bundle. Built in its own credential-free job:
  # the official mcpb CLI is fetched at build time (pinned version) and its
  # dependency tree carries advisories, so it never runs in the job that
  # produces the npm tarball and never sees publish credentials.
  mcpb:
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build:mcpb
      - name: Hash the bundle
        id: hash
        run: |
          set -euo pipefail
          bundle=$(ls build/*.mcpb)
          echo "bundle=$(basename "$bundle")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$bundle" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb-bundle
          path: build/*.mcpb
          retention-days: 30
          if-no-files-found: error
    outputs:
      bundle: ${{ steps.hash.outputs.bundle }}
      sha256: ${{ steps.hash.outputs.sha256 }}

  # Attach the bundle to the release. contents: write only — no id-token,
  # no checkout, no repo code. Independent of release-assets so a bundle
  # failure never blocks the npm release or its SBOM.
  release-mcpb:
    needs: [mcpb, npm-publish]
    if: ${{ github.event_name == 'release' && needs.npm-publish.result == 'success' && needs.mcpb.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb-bundle
          path: mcpb
      - name: Verify and attach the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.mcpb.outputs.bundle }}
          EXPECTED_SHA256: ${{ needs.mcpb.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  mcpb/${BUNDLE}" | sha256sum --check
          (cd mcpb && sha256sum "${BUNDLE}" > "${BUNDLE}.sha256")
          gh release upload "$GITHUB_REF_NAME" "mcpb/${BUNDLE}" "mcpb/${BUNDLE}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  registry-publish:
    needs: npm-publish
    if: ${{ !cancelled() && (needs.npm-publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.registry_only)) }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false
      - name: Wait for npm to serve the version
        # The MCP Registry validates the package against npm, which can lag the
        # publish by a minute or more (v0.17.0's first run failed this way).
        run: |
          set -euo pipefail
          version=$(jq -r '.packages[0].version' server.json)
          name=$(jq -r '.packages[0].identifier' server.json)
          url="https://registry.npmjs.org/${name/\//%2f}/${version}"
          for attempt in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
              echo "npm serves ${name}@${version}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm still does not serve ${name}@${version} after 10 minutes"
          exit 1
      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSLo /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod 700 /tmp/mcp-publisher
      - name: Authenticate to the MCP Registry
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: /tmp/mcp-publisher publish server.json

  verify:
    needs: registry-publish
    if: ${{ github.event_name == 'release' && needs.registry-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Release invariant — installed-truth must match repo-truth
        run: node scripts/release-invariant.mjs
