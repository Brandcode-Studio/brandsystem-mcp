# OpenSSF Scorecard — supply-chain posture checks, results to code scanning.
#
# ossf/scorecard-action is the one third-party action this repo allows, and
# only at the exact SHA pinned below (repo Actions policy: GitHub-owned plus
# this pattern). It is Docker-based and pulls its image at run time.
#
# publish_results is deliberately false and the job gets no OIDC token
# permission: GitHub OIDC publishing to the MCP Registry trusts any workflow
# in this org, so a compromised Scorecard image must never be able to mint a
# token here. The trade-off is no public api.scorecard.dev badge; results stay
# in code scanning. Do not make this a required check (push + schedule only).

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
