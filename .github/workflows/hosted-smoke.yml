name: Hosted MCP Smoke

on:
  workflow_dispatch:
  schedule:
    # 06:17 UTC daily (off-peak, minute offset to avoid the top-of-hour GitHub Actions queue)
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            environment: hosted-smoke
          - target: production
            environment: hosted-smoke-production
    # Live-proof secrets live in per-target environments (deployments limited to
    # main), not in repo secrets, so a workflow_dispatch from another branch
    # can't read them. Feedback writes are skipped via BRANDCODE_MCP_SMOKE_SKIP_FEEDBACK.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run hosted MCP smoke test
        id: smoke
        env:
          BRANDCODE_MCP_SMOKE_URL: ${{ secrets.BRANDCODE_MCP_SMOKE_URL }}
          BRANDCODE_MCP_SMOKE_FULL_KEY: ${{ secrets.BRANDCODE_MCP_SMOKE_FULL_KEY }}
          BRANDCODE_MCP_SMOKE_READ_KEY: ${{ secrets.BRANDCODE_MCP_SMOKE_READ_KEY }}
          BRANDCODE_MCP_SMOKE_ASSET_ID: ${{ secrets.BRANDCODE_MCP_SMOKE_ASSET_ID }}
          BRANDCODE_MCP_SMOKE_SKIP_FEEDBACK: ${{ secrets.BRANDCODE_MCP_SMOKE_SKIP_FEEDBACK }}
          BRANDCODE_MCP_SMOKE_TIMEOUT_MS: ${{ secrets.BRANDCODE_MCP_SMOKE_TIMEOUT_MS }}
        run: |
          set -o pipefail
          # Strict mode (blocked -> failure) only when live-proof credentials are
          # configured; without them the run reports blocked in the summary but
          # stays green instead of failing every scheduled run.
          if [ -n "$BRANDCODE_MCP_SMOKE_URL" ] && [ -n "$BRANDCODE_MCP_SMOKE_FULL_KEY" ]; then
            npm run smoke:hosted-mcp -- --strict --json | tee smoke-output.json
          else
            echo "::notice::Hosted MCP smoke credentials not configured; blocked status will not fail the job. Set BRANDCODE_MCP_SMOKE_URL and BRANDCODE_MCP_SMOKE_FULL_KEY to enable strict live proof."
            npm run smoke:hosted-mcp -- --json | tee smoke-output.json
          fi
      - name: Publish smoke result to job summary
        if: always()
        run: |
          if [ -f smoke-output.json ]; then
            {
              echo "### Hosted MCP smoke result (${{ matrix.target }})"
              echo '```json'
              cat smoke-output.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Hosted MCP smoke result (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
            echo "No output captured (smoke step likely failed before producing JSON)." >> "$GITHUB_STEP_SUMMARY"
          fi
