version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types track the oldest supported runtime (engines: >=22.13.0), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch in-range bumps into one weekly PR; majors stay individual so
      # migrations (zod 4, @types/node) remain deliberate decisions.
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze must move together: a split pair broke main's CodeQL
      # for six days (#74 merged while #75 stalled -> version-mismatch error).
      codeql-action:
        patterns:
          - github/codeql-action*
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - github/codeql-action*
